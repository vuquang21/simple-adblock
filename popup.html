<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 240px; margin: 12px; }
    label { display: flex; align-items: center; gap: 8px; }
    a { display: block; margin-top: 12px; }
    .btn { width: 100%; margin-top: 10px; padding: 6px; cursor: pointer; }
    .btn-outline { background: #fff; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <label><input type="checkbox" id="enabled"> Blocking enabled</label>
  <div id="count" style="margin-top:8px; color:#777;"></div>
  <button class="btn btn-outline" id="site" hidden></button>
  <button class="btn" id="pick" hidden>Block an element on this page</button>
  <div id="picked" style="margin-top:8px; color:#777;"></div>
  <label style="margin-top:10px;"><input type="checkbox" id="autoHide"> Hide ad boxes automatically</label>
  <div id="blocked" style="margin-top:8px; color:#777;"></div>
  <a href="#" id="open">Open dashboard</a>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
